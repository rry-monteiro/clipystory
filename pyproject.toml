[project]
name = "clipystory"
version = "0.1.0"
description = "Um gerenciador de histórico da área de transferência para Linux (wl-clipboard e xclip), feito em Python e DearPyGui"
readme = "README.md"
authors = [
    { name = "Raimundo", email = "ray.yh.yh@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "dearpygui>=2.3.1",
]

[project.scripts]
clipystory = "clipystory.main:main"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"
